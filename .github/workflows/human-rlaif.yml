name: Validate human-rlaif
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install official Agent Skills reference validator
        # agentskills.io/specification links to this official repository.
        # Pin vetted source, not a similarly named package from PyPI.
        # skills-ref 0.1.0; reviewed 2026-10-17. Its dependencies include strictyaml.
        run: python -m pip install -r requirements-dev.txt
      - name: Validate official Agent Skills format
        run: skills-ref validate skill/human-rlaif
      - name: Validate repository and portable skill structure
        run: python scripts/validate_human_rlaif.py
      - name: Test workspace and validation utilities
        run: python -m unittest discover -s tests -p 'test*.py' -v
