name: Validate human-rlaif
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Structural checks
        run: python scripts/validate_human_rlaif.py
      - name: Workspace tests
        run: python -m unittest discover -s tests -p 'test_human_rlaif.py' -v
